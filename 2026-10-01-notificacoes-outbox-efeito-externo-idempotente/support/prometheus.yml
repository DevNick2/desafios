# APOIO ao desafio. Ajuste os alvos para onde os seus serviços expõem
# /metrics. host.docker.internal alcança processos rodando fora do Docker;
# para serviços no compose, use o nome do serviço (ex.: api:8000).
global:
  scrape_interval: 5s

scrape_configs:
  - job_name: notifications
    static_configs:
      - targets:
          - host.docker.internal:8000  # api
          - host.docker.internal:8001  # relay
          - host.docker.internal:8002  # consumer
          - host.docker.internal:8003  # reconciler
